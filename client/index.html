<!doctype html>
<html lang="en">

  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>MySentry.ai - Your Vital Companion</title>    
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script
      defer
      src="%VITE_ANALYTICS_ENDPOINT%/umami"
      data-website-id="%VITE_ANALYTICS_WEBSITE_ID%"></script>
    <script type="module">
      import Chatbot from "https://cdn.jsdelivr.net/npm/flowise-embed/dist/web.js"
      Chatbot.init({
        chatflowid: "343c9ce8-205b-434d-9c95-68737d97752e",
        apiHost: "https://flowise.zigron.com",
        theme: {
          button: {
            backgroundColor: '#6AD990',
            right: 20,
            bottom: 20,
            size: 60,
            dragAndDrop: true,
            iconColor: 'white',
            customIconSrc: 'https://mysentry.ai/wp-content/uploads/2023/10/cropped-MySentry-Favicon-32x32.png',
            autoWindowOpen: {
              autoOpen: true,
              openDelay: 2,
              autoOpenOnMobile: false
            }
          },
          tooltip: {
            showTooltip: true,
            tooltipMessage: 'Hi! Need Help?',
            tooltipBackgroundColor: '#6AD990',
            tooltipTextColor: '#232020',
            tooltipFontSize: 16
          },
          chatWindow: {
            showTitle: true,
            showAgentMessages: true,
            title: 'MySentry Assistant',
            titleAvatarSrc: 'https://mysentry.ai/wp-content/uploads/2023/10/cropped-MySentry-Favicon-32x32.png',
            welcomeMessage: 'Welcome to MySentry! I’m here to help you find the perfect safety plan for your peace of mind. What can I help you with today?',
            errorMessage: 'I am having trouble connecting. Please try again later.',
            backgroundColor: '#ffffff',
            height: 600,
            width: 400,
            fontSize: 16,
            starterPrompts: [
              "How do I add emergency contacts?",
              "How does the Panic Alarm work?",
              "What is included in the Essential Safety plan?"
            ],
            starterPromptFontSize: 14,
            clearChatOnReload: true,
            botMessage: {
              backgroundColor: '#f0f9ff',
              textColor: '#1a1a1a',
              showAvatar: true,
              avatarSrc: 'https://mysentry.ai/wp-content/uploads/2023/10/cropped-MySentry-Favicon-32x32.png'
            },
            userMessage: {
              backgroundColor: '#6AD990',
              textColor: '#232020',
              showAvatar: false
            },
            textInput: {
              placeholder: 'Type your question here...',
              backgroundColor: '#ffffff',
              textColor: '#1a1a1a',
              sendButtonColor: '#6AD990',
              maxChars: 200,
              maxCharsWarningMessage: 'You exceeded the character limit.',
              autoFocus: true,
              sendMessageSound: true,
              receiveMessageSound: true
            },
            footer: {
              textColor: '#666',
              text: 'Powered by',
              company: 'MySentry.AI',
              companyLink: 'https://www.mysentry.ai/'
            }
          }
        }
      })
    </script>
  </body>

</html>
